name: Lint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - run: python -m pip install black mypy
    - run: python -m black --check bloomfilter tests benchmarks scripts
    - run: python -m mypy bloomfilter --strict
